#version: "3.9"

# ============================================================================
# DocKA — Docker Compose (Core Platform)
#
# This compose file deploys the full DocKA Core architecture:
# - Metadata store (PostgreSQL — two databases: docka_app + docka_airflow)
# - Search engine (Elasticsearch)
# - ingestion orchestrator (Airflow 2.10 — CeleryExecutor + Redis)
# - Retrieval API (FastAPI)
# - User Interface (Streamlit)
#
# Airflow Architecture (CeleryExecutor pattern):
# - airflow-webserver : Web UI
# - airflow-scheduler : DAG scheduling + task queue submission
# - airflow-worker    : Celery task executor (runs actual DAG tasks)
# - airflow-triggerer : Deferred/async task handler
# - redis             : Celery message broker
#
# Scope:
# - Local development
# - Proof of Concept (POC)
# - Architecture validation
#
# Non-goals:
# - High availability
# - Security hardening
# - Cloud-managed services
# ============================================================================


# ----------------------------------------------------------------------------
# Airflow Common — Shared Configuration Block
#
# NOT a service. A YAML anchor reused by all Airflow services to avoid
# duplication and ensure consistency across all components.
#
# Based on the official Apache Airflow 2.10 Docker Compose pattern.
#
# DocKA-specific overrides:
# - Custom Dockerfile (airflow.Dockerfile) extending apache/airflow:2.10.4
# - docka_airflow database instead of the default 'airflow' database
# - DocKA volume mounts (DAGs, ingestion package, app, data)
# - All services on docka_net for cross-service DNS resolution
# - Performance tuning for laptop/local Docker environments
#
# Environment variable naming convention:
#   AIRFLOW__{SECTION}__{KEY}
#
# Key decisions:
# - CeleryExecutor: tasks distributed via Redis, executed by worker containers
# - Airflow 2.10: stable, well-tested, no JWT auth issues between components
# - FERNET_KEY: empty = Airflow auto-generates one at startup (fine for POC)
# ----------------------------------------------------------------------------
x-airflow-common:
  &airflow-common

  build:
    context: ..
    dockerfile: infra/docker/airflow.Dockerfile

  env_file:
    - .env

  environment:
    &airflow-common-env

    # ---- Core ---------------------------------------------------------------
    AIRFLOW__CORE__EXECUTOR: CeleryExecutor
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    # ---- Database -----------------------------------------------------------
    # Isolated from docka_app to prevent schema conflicts
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/docka_airflow

    # ---- Celery -------------------------------------------------------------
    # Result backend: task results stored in Airflow's own DB
    AIRFLOW__CELERY__RESULT_BACKEND: db+postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/docka_airflow

    # Broker: Redis queue for distributing tasks from scheduler to workers
    AIRFLOW__CELERY__BROKER_URL: redis://:@redis:6379/0

    # ---- Security -----------------------------------------------------------
    # FERNET_KEY: encrypts connection passwords in the DB
    # Empty = Airflow auto-generates one at startup (fine for POC)
    # For production: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
    AIRFLOW__CORE__FERNET_KEY: ""

    # ---- Webserver ----------------------------------------------------------
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW__WEBSERVER__SECRET_KEY}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"

    # ---- Scheduler health check ---------------------------------------------
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"

    # ---- Logging ------------------------------------------------------------
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    AIRFLOW__LOGGING__REMOTE_LOGGING: "false"

    # ---- Performance tuning — Laptop Safe Profile ---------------------------
    # Max concurrent task instances across all DAGs
    AIRFLOW__CORE__PARALLELISM: "6"

    # Max concurrent tasks per DAG
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: "3"

    # Max concurrent DAG runs per DAG (1 = no backlog buildup)
    AIRFLOW__CORE__MAX_ACTIVE_RUNS_PER_DAG: "1"

    # Scheduler heartbeat interval in seconds
    AIRFLOW__SCHEDULER__SCHEDULER_HEARTBEAT_SEC: "10"

    # ---- Python path --------------------------------------------------------
    # Makes DocKA packages importable inside DAG task code
    PYTHONPATH: /opt/airflow:/opt/airflow/ingestion:/opt/airflow/app

    # ---- Additional pip requirements ----------------------------------------
    # Use ONLY for quick checks — prefer building into airflow.Dockerfile
    _PIP_ADDITIONAL_REQUIREMENTS: ""

  volumes:
    # DAG files — ingestion pipeline definitions
    - ../ingestion/airflow/dags:/opt/airflow/dags

    # Optional Airflow plugins
    - ../ingestion/airflow/plugins:/opt/airflow/plugins

    # ingestion domain package (importable as `ingestion.*` in DAG code)
    - ../ingestion:/opt/airflow/ingestion

    # App code — DocKA Core (importable as `app.*` in DAG code)
    - ../app:/opt/airflow/app

    # Raw documents for ingestion pipelines
    - ../data:/data

    # Shared log volume — mounted on ALL Airflow services so the
    # webserver can serve logs written by workers via the UI
    - airflow_logs:/opt/airflow/logs

  user: "${AIRFLOW_UID:-50000}:0"

  networks:
    - docka_net

  depends_on:
    &airflow-common-depends-on
    redis:
      condition: service_healthy
    postgres:
      condition: service_healthy


services:

  # --------------------------------------------------------------------------
  # PostgreSQL — Single Instance, Two Databases
  #
  # docka_app     : DocKA application metadata
  #                 - document_id, source_path, title, language, checksum
  #                 - Managed by FastAPI and ingestion pipelines
  #
  # docka_airflow : Airflow internal metadata
  #                 - DAG definitions, task instances, job history
  #                 - Managed exclusively by Airflow components
  #
  # Init scripts run ONCE on a fresh volume:
  # - 01_init.sql: creates databases, grants, and documents table
  #
  # To re-run init scripts: docker compose down -v
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: docka_postgres
    ports:
      - "5432:5432"
    restart: unless-stopped

    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql

    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER:-docka}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    networks:
      - docka_net


  # --------------------------------------------------------------------------
  # pgAdmin — PostgreSQL Admin UI
  #
  # Access: http://localhost:5050
  # Login: admin@docka.local / docka
  # --------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: docka_pgadmin
    ports:
      - "5050:80"
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}

    depends_on:
      - postgres

    networks:
      - docka_net


  # --------------------------------------------------------------------------
  # Elasticsearch — Full-Text Search Engine
  #
  # Provides:
  # - Full-text indexing of document content
  # - BM25 ranking
  # - Language-specific analyzers (EN / FR)
  #
  # Single-node POC setup. Index is disposable — rebuildable from pipelines.
  # Memory reduced to 512m to leave headroom for Celery workers.
  # --------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: docka_elasticsearch
    ports:
      - "9200:9200"
    restart: unless-stopped

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"

    volumes:
      - es_data:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - docka_net


  # --------------------------------------------------------------------------
  # Redis — Celery Message Broker
  #
  # Airflow CeleryExecutor task queue:
  # - Scheduler pushes task requests into Redis
  # - Workers pull and execute tasks from Redis
  # - No persistence needed — queue is ephemeral
  #
  # Locked to 7.2-bookworm due to Redis licensing change in 7.4+
  # --------------------------------------------------------------------------
  redis:
    image: redis:7.2-bookworm
    container_name: docka_redis
    expose:
      - 6379
    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 30s
      retries: 50
      start_period: 30s

    networks:
      - docka_net


  # --------------------------------------------------------------------------
  # Airflow Init — DB Migration & Admin User Creation
  #
  # Runs ONCE at startup then exits (service_completed_successfully).
  # All other Airflow services wait for this before starting.
  #
  # Responsibilities:
  # - Creates Airflow metadata tables in docka_airflow (db migrate)
  # - Creates the initial admin user
  # - Creates required directories with correct ownership
  # --------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: docka_airflow_init

    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/{logs,dags,plugins}
        chown -R "${AIRFLOW_UID:-50000}:0" /opt/airflow/{logs,dags,plugins}
        exec /entrypoint airflow version

    environment:
      <<: *airflow-common-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-admin}
      _PIP_ADDITIONAL_REQUIREMENTS: ""

    user: "0:0"


  # --------------------------------------------------------------------------
  # Airflow Webserver — Web UI
  #
  # Provides the Airflow web interface:
  # - DAG list and graph views
  # - Task instance logs
  # - Manual trigger, pause, clear
  # - Admin and connections management
  #
  # Access: http://localhost:8088
  # Login: admin / admin (set via .env)
  # --------------------------------------------------------------------------
  airflow-webserver:
    <<: *airflow-common
    container_name: docka_airflow_webserver

    command: webserver

    ports:
      - "8088:8080"

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


  # --------------------------------------------------------------------------
  # Airflow Scheduler — DAG Scheduling Engine
  #
  # Responsible for:
  # - Evaluating DAG schedules and creating DAG runs
  # - Parsing DAG files (built-in to scheduler in Airflow 2.x)
  # - Submitting ready tasks to the Redis queue
  # - Managing task state transitions and timeouts
  # --------------------------------------------------------------------------
  airflow-scheduler:
    <<: *airflow-common
    container_name: docka_airflow_scheduler

    command: scheduler

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


  # --------------------------------------------------------------------------
  # Airflow Worker — Celery Task Executor
  #
  # Responsible for:
  # - Pulling task execution requests from the Redis queue
  # - Running the actual DAG task Python callables
  # - This is where your ingestion code actually executes
  #
  # DUMB_INIT_SETSID=0: required for clean warm shutdown of Celery workers.
  # --------------------------------------------------------------------------
  airflow-worker:
    <<: *airflow-common
    container_name: docka_airflow_worker

    command: celery worker

    restart: unless-stopped

    environment:
      <<: *airflow-common-env
      DUMB_INIT_SETSID: "0"

    healthcheck:
      test:
        - "CMD-SHELL"
        - 'celery --app airflow.executors.celery_executor.app inspect ping -d "celery@$${HOSTNAME}"'
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


  # --------------------------------------------------------------------------
  # Airflow Triggerer — Deferred Task Handler
  #
  # Handles deferred/async tasks using asyncio.
  # Not required for basic PythonOperator pipelines but included for
  # forward compatibility with sensors and async operators.
  # --------------------------------------------------------------------------
  airflow-triggerer:
    <<: *airflow-common
    container_name: docka_airflow_triggerer

    command: triggerer

    restart: unless-stopped

    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    depends_on:
      <<: *airflow-common-depends-on
      airflow-init:
        condition: service_completed_successfully


  # --------------------------------------------------------------------------
  # FastAPI — Retrieval API
  #
  # Single entry point for all DocKA retrieval operations:
  # - GET /search  : BM25 full-text search via Elasticsearch
  # - GET /health  : Service health check
  # - future       : /ask, /chat, /feedback
  #
  # Connects to Elasticsearch (search) and PostgreSQL docka_app (metadata).
  # --------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: docka_api
    ports:
      - "8000:8000"
    restart: unless-stopped

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: docka_app
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ELASTICSEARCH_HOST: ${ELASTICSEARCH_HOST}

    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

    networks:
      - docka_net


  # --------------------------------------------------------------------------
  # Streamlit — User Interface
  #
  # Lightweight frontend for submitting queries and viewing results.
  # Access: http://localhost:8501
  # --------------------------------------------------------------------------
  ui:
    build:
      context: ..
      dockerfile: infra/docker/ui.Dockerfile
    container_name: docka_ui
    ports:
      - "8501:8501"
    restart: unless-stopped

    environment:
      API_BASE_URL: ${API_BASE_URL}

    depends_on:
      - api

    networks:
      - docka_net


# ---------------------------------------------------------------------------
# Volumes
#
# Persistent storage for stateful services.
# To fully reset all data: docker compose down -v
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  es_data:
  airflow_logs:


# ---------------------------------------------------------------------------
# Networks
#
# Single private bridge network for all DocKA services.
# All containers reach each other by service name (internal DNS).
# ---------------------------------------------------------------------------
networks:
  docka_net:
    driver: bridge
