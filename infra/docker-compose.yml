#version: "3.9"

# ============================================================================
# DocKA — Docker Compose (Core Platform)
#
# This compose file deploys the DocKA Core architecture:
# - Metadata store (PostgreSQL)
# - Search engine (Elasticsearch)
# - Ingestion orchestrator (Airflow)
# - Retrieval API (FastAPI)
# - User Interface (Streamlit)
#
# Scope:
# - Local development
# - Proof of Concept (POC)
# - Architecture validation
#
# Non-goals:
# - High availability
# - Security hardening
# - Cloud-managed services
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # PostgreSQL — Metadata Store
  #
  # Stores authoritative document metadata:
  # - document_id
  # - source_path
  # - title
  # - language
  # - checksum
  # - ingestion timestamps
  #
  # IMPORTANT:
  # - This DB does NOT store full document text for retrieval
  # - Elasticsearch is considered a disposable index
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: docka_postgres
    ports:
      - "5432:5432"
    restart: unless-stopped

    environment:
      POSTGRES_DB: docka
      POSTGRES_USER: docka
      POSTGRES_PASSWORD: docka

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docka"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - docka_net


  # --------------------------------------------------------------------------
  # pgAdmin — PostgreSQL Admin UI
  #
  # Provides:
  # - Web-based administration interface
  # - Query execution
  # - Schema inspection
  #
  # Intended for:
  # - Development
  # - Debugging
  # - Manual data inspection
  # --------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: docka_pgadmin
    ports:
      - "5050:80"
    restart: always

    environment:
      PGADMIN_DEFAULT_EMAIL: rd.mouhouadi@gmail.com
      PGADMIN_DEFAULT_PASSWORD: docka

    depends_on:
      - postgres

    networks:
      - docka_net


  # --------------------------------------------------------------------------
  # Elasticsearch — Keyword Search Engine
  #
  # Provides:
  # - Full-text indexing
  # - BM25 ranking
  # - Language-specific analyzers (EN / FR)
  #
  # Notes:
  # - Single-node setup for POC
  # - Indexes are rebuildable from ingestion pipelines
  # --------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: docka_elasticsearch
    ports:
      - "9200:9200"
    restart: unless-stopped

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"

    volumes:
      - es_data:/usr/share/elasticsearch/data

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

    networks:
      - docka_net


    # --------------------------------------------------------------------------
  # Airflow — Ingestion Orchestrator
  #
  # Orchestrates document ingestion pipelines:
  # - Watch folders / sources
  # - Extract text
  # - Clean & normalize
  # - Store metadata
  # - Index into Elasticsearch
  #
  # Architecture (Airflow 3.x):
  # - API Server (Web UI + REST API)
  # - Scheduler
  # - DAG Processor
  # - Triggerer
  #
  # Executor:
  # - LocalExecutor (single-node execution for POC)
  #
  # This setup follows the official Apache Airflow 3
  # Docker architecture pattern.
  # --------------------------------------------------------------------------


  # --------------------------------------------------------------------------
  # Airflow Init — Metadata DB Migration & Admin Creation
  #
  # Responsible for:
  # - Running metadata database migrations
  # - Creating initial admin user
  #
  # Uses official entrypoint flags:
  #   _AIRFLOW_DB_MIGRATE
  #   _AIRFLOW_WWW_USER_CREATE
  #
  # Runs once and must complete successfully
  # before other Airflow services start.
  # --------------------------------------------------------------------------
  airflow-init:
    build:
      context: ..
      dockerfile: infra/docker/airflow.Dockerfile
    container_name: docka_airflow_init

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://docka:docka@postgres:5432/docka
      AIRFLOW__CORE__FERNET_KEY: "REPLACE_WITH_FERNET_KEY"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__WEBSERVER__SECRET_KEY: "ePOgwKVYwIalRPsnUwW5ElId__31uF6J1yMq2oovRQM"
      PYTHONPATH: /opt/airflow:/opt/airflow/Ingestion:/opt/airflow/app

      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin

    volumes:
      # DAGs defining ingestion pipelines
      - ../Ingestion/airflow/dags:/opt/airflow/dags

      # Optional plugins
      - ../Ingestion/airflow/plugins:/opt/airflow/plugins

      # Ingestion domain package
      - ../Ingestion:/opt/airflow/Ingestion

      # App code (DocKA Core)
      - ../app:/opt/airflow/app

      # Shared data access (documents)
      - ../data:/data

      # Shared logs access
      - airflow_logs:/opt/airflow/logs


    entrypoint: /bin/bash
    command:
      - -c
      - |
        exec /entrypoint airflow version

    depends_on:
      postgres:
        condition: service_healthy

    user: "0:0"

    networks:
      - docka_net


  # --------------------------------------------------------------------------
  # Airflow API Server — Web UI & REST API
  #
  # Provides:
  # - Web-based Airflow UI
  # - REST API
  #
  # Exposes:
  # - Port 8080
  #
  # Starts only after airflow-init completes successfully.
  # --------------------------------------------------------------------------
  airflow-apiserver:
    build:
      context: ..
      dockerfile: infra/docker/airflow.Dockerfile
    container_name: docka_airflow_apiserver

    command: api-server

    ports:
      - "8088:8080"

    restart: unless-stopped

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://docka:docka@postgres:5432/docka
      AIRFLOW__CORE__FERNET_KEY: "REPLACE_WITH_FERNET_KEY"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__WEBSERVER__SECRET_KEY: "ePOgwKVYwIalRPsnUwW5ElId__31uF6J1yMq2oovRQM"
      AIRFLOW_WEBSERVER_DEFAULT_UI_LANGUAGE: en
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      PYTHONPATH: /opt/airflow:/opt/airflow/Ingestion:/opt/airflow/app

    volumes:
      # DAGs defining ingestion pipelines
      - ../Ingestion/airflow/dags:/opt/airflow/dags

      # Optional plugins
      - ../Ingestion/airflow/plugins:/opt/airflow/plugins

      # Ingestion domain package
      - ../Ingestion:/opt/airflow/Ingestion

      # App code (DocKA Core)
      - ../app:/opt/airflow/app

      # Shared data access (documents)
      - ../data:/data

      # Shared logs access
      - airflow_logs:/opt/airflow/logs

    depends_on:
      airflow-init:
        condition: service_completed_successfully

    networks:
      - docka_net


  # --------------------------------------------------------------------------
  # Airflow Scheduler — DAG Scheduling Engine
  #
  # Responsible for:
  # - Scheduling DAG runs
  # - Managing task state transitions
  #
  # No ports exposed.
  # --------------------------------------------------------------------------
  airflow-scheduler:
    build:
      context: ..
      dockerfile: infra/docker/airflow.Dockerfile
    container_name: docka_airflow_scheduler

    command: scheduler

    restart: unless-stopped

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://docka:docka@postgres:5432/docka
      AIRFLOW__CORE__FERNET_KEY: "REPLACE_WITH_FERNET_KEY"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__WEBSERVER__SECRET_KEY: "ePOgwKVYwIalRPsnUwW5ElId__31uF6J1yMq2oovRQM"
      PYTHONPATH: /opt/airflow:/opt/airflow/Ingestion:/opt/airflow/app

    volumes:
      # DAGs defining ingestion pipelines
      - ../Ingestion/airflow/dags:/opt/airflow/dags

      # Optional plugins
      - ../Ingestion/airflow/plugins:/opt/airflow/plugins

      # Ingestion domain package
      - ../Ingestion:/opt/airflow/Ingestion

      # App code (DocKA Core)
      - ../app:/opt/airflow/app

      # Shared data access (documents)
      - ../data:/data

      # Shared logs access
      - airflow_logs:/opt/airflow/logs


    depends_on:
      airflow-init:
        condition: service_completed_successfully

    networks:
      - docka_net


  # --------------------------------------------------------------------------
  # Airflow DAG Processor — DAG Parsing Service
  #
  # Responsible for:
  # - Parsing DAG files
  # - Updating DAG metadata
  #
  # Required in Airflow 3 architecture.
  # --------------------------------------------------------------------------
  airflow-dag-processor:
    build:
      context: ..
      dockerfile: infra/docker/airflow.Dockerfile
    container_name: docka_airflow_dag_processor

    command: dag-processor

    restart: unless-stopped

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://docka:docka@postgres:5432/docka
      AIRFLOW__CORE__FERNET_KEY: "REPLACE_WITH_FERNET_KEY"
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      AIRFLOW__WEBSERVER__SECRET_KEY: "ePOgwKVYwIalRPsnUwW5ElId__31uF6J1yMq2oovRQM"
      PYTHONPATH: /opt/airflow:/opt/airflow/Ingestion:/opt/airflow/app

    volumes:
      # DAGs defining ingestion pipelines
      - ../Ingestion/airflow/dags:/opt/airflow/dags

      # Optional plugins
      - ../Ingestion/airflow/plugins:/opt/airflow/plugins

      # Ingestion domain package
      - ../Ingestion:/opt/airflow/Ingestion

      # App code (DocKA Core)
      - ../app:/opt/airflow/app

      # Shared data access (documents)
      - ../data:/data

      # Shared logs access
      - airflow_logs:/opt/airflow/logs


    depends_on:
      airflow-init:
        condition: service_completed_successfully

    networks:
      - docka_net


  # --------------------------------------------------------------------------
  # FastAPI — Retrieval API
  #
  # Acts as the single entry point for retrieval logic:
  # - /search (BM25)
  # - future: /ask, /chat, /feedback
  #
  # This service:
  # - Talks to Elasticsearch for search
  # - Talks to PostgreSQL for metadata
  #
  # IMPORTANT:
  # - No domain-specific logic lives here
  # --------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile
    container_name: docka_api
    ports:
      - "8000:8000"
    restart: unless-stopped

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: docka
      POSTGRES_USER: docka
      POSTGRES_PASSWORD: docka
      ELASTICSEARCH_HOST: http://elasticsearch:9200

    depends_on:
      - postgres
      - elasticsearch

    networks:
      - docka_net


  # --------------------------------------------------------------------------
  # Streamlit — User Interface
  #
  # Provides a lightweight UI for:
  # - Submitting queries
  # - Viewing ranked results
  # - Inspecting snippets
  #
  # Intended for:
  # - Demos
  # - Debugging
  # - Internal users
  # --------------------------------------------------------------------------
  ui:
    build:
      context: ..
      dockerfile: infra/docker/ui.Dockerfile
    container_name: docka_ui
    ports:
      - "8501:8501"
    restart: unless-stopped

    environment:
      API_BASE_URL: http://api:8000

    depends_on:
      - api

    networks:
      - docka_net


# ---------------------------------------------------------------------------
# Volumes
#
# Persistent storage for stateful services.
# Safe to delete during development if a full reset is needed.
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  es_data:
  airflow_logs:


# ---------------------------------------------------------------------------
# Networks
#
# Single private bridge network for all DocKA services.
# ---------------------------------------------------------------------------
networks:
  docka_net:
    driver: bridge
