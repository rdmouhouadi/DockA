#version: "3"

# ============================================================================
# DocKA — Docker Compose (Core Platform)
#
# This compose file deploys the DocKA Core architecture:
# - Metadata store (PostgreSQL)
# - Search engine (Elasticsearch)
# - Ingestion orchestrator (Airflow)
# - Retrieval API (FastAPI)
# - User Interface (Streamlit)
#
# Scope:
# - Local development
# - Proof of Concept (POC)
# - Architecture validation
#
# Non-goals:
# - High availability
# - Security hardening
# - Cloud-managed services
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # PostgreSQL — Metadata Store
  #
  # Stores authoritative document metadata:
  # - document_id
  # - source_path
  # - title
  # - language
  # - checksum
  # - ingestion timestamps
  #
  # IMPORTANT:
  # - This DB does NOT store full document text for retrieval
  # - Elasticsearch is considered a disposable index
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:15
    container_name: docka_postgres
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg-isready -U docka"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    environment:
      POSTGRES_DB: docka
      POSTGRES_USER: docka
      POSTGRES_PASSWORD: docka

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - docka_net
  
  # --------------------------------------------------------------------------
  # pgAdmin — PostgreSQL Admin UI
  # --------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4
    container_name: docka_pgadmin
    ports:
      - "5050:80"
    
    environment:
      PGADMIN_DEFAULT_EMAIL: rd.mouhouadi@gmail.com
      PGADMIN_DEFAULT_PASSWORD: docka
    
    restart: always

    depends_on:
      - postgres

    networks:
      - docka_net

  # --------------------------------------------------------------------------
  # Elasticsearch — Keyword Search Engine
  #
  # Provides:
  # - Full-text indexing
  # - BM25 ranking
  # - Language-specific analyzers (EN / FR)
  #
  # Notes:
  # - Single-node setup for POC
  # - Indexes are rebuildable from ingestion pipelines
  # --------------------------------------------------------------------------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: docka_elasticsearch
    ports:
      - "9200:9200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://elasticsearch:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms1g -Xmx1g"

    volumes:
      - es_data:/usr/share/elasticsearch/data

    networks:
      - docka_net


  # --------------------------------------------------------------------------
  # Airflow — Ingestion Orchestrator
  #
  # Orchestrates document ingestion pipelines:
  # - Watch folders / sources
  # - Extract text
  # - Clean & normalize
  # - Store metadata
  # - Index into Elasticsearch
  #
  # This is a simplified, dual-container Airflow setup suitable for POC but also production ready
  # --------------------------------------------------------------------------

  # --------------------------------------------------------------------------
  # Airflow Webserver — UI
  #
  # Provides:
  # - Airflow UI (DAGs, logs, manual triggers)
  #
  # Runs as the main foreground process to ensure
  # port 8080 is properly exposed.
  # --------------------------------------------------------------------------
  airflow-webserver:
    build:
      context: ..
      dockerfile: infra/docker/airflow.Dockerfile
    container_name: docka_airflow_webserver
    ports:
      - "8080:8080"
    restart: unless-stopped

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://docka:docka@postgres:5432/docka
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "ZmFrZV9mZXJuZXRfa2V5XzMyX2J5dGVzIQ=="
      AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8080
      AIRFLOW__WEBSERVER__SECRET_KEY: "qYk6W6x9X7pZb5uC8c3K8cZq9lQ0mV0nN4hX1X8ZxQ="
      AIRFLOW__LOGGING__REMOTE_LOGGING: "false"
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
      PYTHONPATH: /opt/airflow

    volumes:
      # DAGs defining ingestion pipelines
      - ../Ingestion/airflow/dags:/opt/airflow/dags

      # Optional plugins
      - ../Ingestion/airflow/plugins:/opt/airflow/plugins

      # Ingestion domain package
      - ../Ingestion:/opt/airflow/Ingestion

      # App code (DocKA Core)
      - ../app:/opt/airflow/app

      # Shared data access (documents)
      - ../data:/data

      # Shared logs access
      - airflow_logs:/opt/airflow/logs

    depends_on:
      - postgres

    command: >
      bash -c "
      echo 'Waiting for Postgress...' &&
      until pg_isready -h postgres -U docka; do sleep 2; done &&

      echo 'Initializing Airflow DB...' &&
      airflow db init &&

      echo 'Creating admin user (if not exist)...' &&
      airflow users create \
        --username admin \
        --password admin \
        --firstname admin \
        --lastname admin \
        --role Admin \
        --email rd.mouhouadi@gmail.com || true &&
      
      echo 'Starting Airflow Webserver...' &&
      exec airflow webserver
      "

    networks:
      - docka_net


  # --------------------------------------------------------------------------
  # Airflow Scheduler — DAG execution engine
  #
  # Responsible for:
  # - Scheduling DAG runs
  # - Executing ingestion tasks
  #
  # No ports exposed.
  # --------------------------------------------------------------------------
  airflow-scheduler:
    build:
      context: ..
      dockerfile: infra/docker/airflow.Dockerfile
    container_name: docka_airflow_scheduler
    restart: unless-stopped

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://docka:docka@postgres:5432/docka
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__FERNET_KEY: "ZmFrZV9mZXJuZXRfa2V5XzMyX2J5dGVzIQ=="
      AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8080
      AIRFLOW__WEBSERVER__SECRET_KEY: "qYk6W6x9X7pZb5uC8c3K8cZq9lQ0mV0nN4hX1X8ZxQ="
      AIRFLOW__LOGGING__REMOTE_LOGGING: "false"
      AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
      PYTHONPATH: /opt/airflow

    volumes:
      - ../Ingestion/airflow/dags:/opt/airflow/dags
      - ../Ingestion/airflow/plugins:/opt/airflow/plugins
      - ../Ingestion:/opt/airflow/Ingestion
      - ../app:/opt/airflow/app
      - ../data:/data
      - airflow_logs:/opt/airflow/logs

    depends_on:
      - postgres
      - airflow-webserver

    command: >
      bash -c "
      exec airflow scheduler
      "

    networks:
      - docka_net

  # --------------------------------------------------------------------------
  # FastAPI — Retrieval API
  #
  # Acts as the single entry point for retrieval logic:
  # - /search (BM25)
  # - future: /ask, /chat, /feedback
  #
  # This service:
  # - Talks to Elasticsearch for search
  # - Talks to PostgreSQL for metadata
  #
  # IMPORTANT:
  # - No domain-specific logic lives here
  # --------------------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: infra/docker/api.Dockerfile

    container_name: docka_api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: docka
      POSTGRES_USER: docka
      POSTGRES_PASSWORD: docka
      ELASTICSEARCH_HOST: http://elasticsearch:9200

    depends_on:
      - postgres
      - elasticsearch

    networks:
      - docka_net


  # --------------------------------------------------------------------------
  # Streamlit — User Interface
  #
  # Provides a lightweight UI for:
  # - Submitting queries
  # - Viewing ranked results
  # - Inspecting snippets
  #
  # Intended for:
  # - Demos
  # - Debugging
  # - Internal users
  # --------------------------------------------------------------------------
  ui:
    build:
      context: ..
      dockerfile: infra/docker/ui.Dockerfile

    container_name: docka_ui
    ports:
      # Streamlit UI
      - "8501:8501"
    restart: unless-stopped

    environment:
      API_BASE_URL: http://api:8000

    depends_on:
      - api

    networks:
      - docka_net


# ---------------------------------------------------------------------------
# Volumes
#
# Persistent storage for stateful services.
# Safe to delete during development if a full reset is needed.
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  es_data:
  airflow_logs:


# ---------------------------------------------------------------------------
# Networks
#
# Single private bridge network for all DocKA services.
# ---------------------------------------------------------------------------
networks:
  docka_net:
    driver: bridge
