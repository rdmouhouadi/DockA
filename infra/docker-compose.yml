# ============================================================================
# DocKA — Docker Compose (Full Stack)
#
# Run:  docker compose up -d        (from infra/)
#
# Entry point for the complete platform: DocKA Core + every enabled vertical.
# This file defines no services itself — it composes the per-layer files
# so each service is declared exactly once:
#
#   docker-compose.core.yml      → Postgres, Elasticsearch, Airflow, API, UI
#   docker-compose.clinical.yml  → core + Neo4j (DocKA Clinical)
#
# Need just one layer? Target its file directly:
#   docker compose -f docker-compose.core.yml up -d
#   docker compose -f docker-compose.clinical.yml up -d
#
# Requires Docker Compose v2.20+ (`include:` support).
# ============================================================================

include:
  # Core platform — always part of the full stack
  - docker-compose.core.yml

  # Verticals — enable when they ship. Each vertical file already
  # includes core, so when enabling one, replace the core line above
  # with the vertical file to avoid including core twice.
  # - docker-compose.clinical.yml   # DocKA Clinical (Month 2)
